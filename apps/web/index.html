<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fernando Ordiales — AI Engineer</title>
    <meta
      name="description"
      content="AI engineer in Manila building AI products end to end — model integration, interfaces, APIs and the cloud infrastructure they run on."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fernando Ordiales — AI Engineer" />
    <meta
      property="og:description"
      content="AI engineer in Manila building AI products end to end — model integration, interfaces, APIs and the cloud infrastructure they run on."
    />
    <!-- TODO(Fernando): scrapers need an absolute og:image URL; prefix the
         production domain once it exists. -->
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="theme-color"
      content="#fbfbfd"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#131316"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Set the theme before first paint so neither theme ever flashes.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="min-w-80 bg-background font-sans text-text antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
